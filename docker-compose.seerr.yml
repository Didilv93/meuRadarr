name: seerr

services:
  seerr:
    image: seerr/seerr:preview-new-oidc@sha256:2b714a6d17590b554d388d70adc6c4ea6507d9367c23eb42e4319693b55aa054
    init: true
    container_name: seerr
    environment:
      - TZ=Europe/London
    volumes:
      - /home/diego/seerr/config:/app/config
    ports:
      - 5055:5055
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - arr-network

networks:
  arr-network:
    external: true

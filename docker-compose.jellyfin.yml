name: jellyfin

services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
    volumes:
      - /home/diego/jellyfin/config:/config
      - /mnt/storage/diego/radarr/movies:/movies
      - /mnt/storage/diego/radarr/series:/series
      - /mnt/storage/diego/radarr/anime:/anime
    ports:
      - 8096:8096
    restart: unless-stopped
    networks:
      - arr-network

networks:
  arr-network:
    external: true

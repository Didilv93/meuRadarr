name: radarr

services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000       # ajuste com o valor do seu `id`
      - PGID=1000       # ajuste com o valor do seu `id`
      - TZ=Europe/London
    volumes:
      - /home/diego/radarr/config:/config
      - /mnt/storage/diego/radarr/movies:/movies
      - /mnt/storage/diego/radarr/series:/series
      - /mnt/storage/diego/radarr/anime:/anime
      - /mnt/storage/diego/radarr/downloads:/downloads
    ports:
      - 7878:7878
    restart: unless-stopped

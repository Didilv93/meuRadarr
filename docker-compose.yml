services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000       # ajuste com o valor do seu `id`
      - PGID=1000       # ajuste com o valor do seu `id`
      - TZ=Europe/London
    volumes:
      - /opt/radarr/config:/config
      - /data/movies:/movies
      - /data/downloads:/downloads
    ports:
      - 7878:7878
    restart: unless-stopped
name: sonarr

services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
    volumes:
      - /home/diego/sonarr/config:/config
      - /mnt/storage/diego/radarr/series:/series
      - /mnt/storage/diego/radarr/anime:/anime
      - /mnt/storage/diego/radarr/downloads:/downloads
    ports:
      - 8989:8989
    restart: unless-stopped
    networks:
      - arr-network

networks:
  arr-network:
    external: true
